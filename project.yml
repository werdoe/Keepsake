name: IGSaver
options:
  bundleIdPrefix: com.rai
  deploymentTarget:
    iOS: "16.0"
targets:
  IGSaver:
    type: application
    platform: iOS
    sources: [IGSaver]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rai.igsaver
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: IGSaver
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: IGSaver saves the photos and videos you download to your library.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
